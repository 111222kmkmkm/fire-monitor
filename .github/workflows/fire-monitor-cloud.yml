name: Fire Monitor Cloud Pipeline

on:
  workflow_dispatch:
  schedule:
    # GitHub cron 可能延迟或漏触发，自续调度会在每轮结束后补排下一轮。
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fire-monitor-cloud
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      cycle-started-at: ${{ steps.cycle.outputs.epoch }}

    defaults:
      run:
        shell: bash
        working-directory: fire_monitor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record cycle start time
        id: cycle
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fire_monitor/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # 云端火点识别 scorer 最小依赖（west-b70 LightGBM）
          python -m pip install numpy pandas pyarrow lightgbm

      - name: Create runtime configs for GitHub Actions
        run: npm run config:github-actions
        env:
          JAXA_FTP_USER: ${{ secrets.JAXA_FTP_USER }}
          JAXA_FTP_PASSWORD: ${{ secrets.JAXA_FTP_PASSWORD }}

      - name: Initialize geodatabase
        run: node ./scripts/init-mobile-geodatabase.mjs --out ./fire_monitor.geodatabase


      - name: Verify v15 production model is present
        run: |
          test -f ./models/himawari-fire-recognition-production/candidate_classifier.txt
          test -f ./models/himawari-fire-recognition-production/model-card.json
          python - <<'PY'
          from pathlib import Path
          p = Path('models/himawari-fire-recognition-production/candidate_classifier.txt')
          print('model_bytes', p.stat().st_size)
          PY

      - name: Restore v15 online temporal cache
        uses: actions/cache@v4
        with:
          path: fire_monitor/data-store/algorithm-state/himawari-v15-online-grid-temporal.parquet
          key: v15-online-temporal-${{ github.run_id }}
          restore-keys: |
            v15-online-temporal-

      - name: Download observations and detect fires
        run: node ./scripts/cloud-pipeline.mjs --once --config ./.cloud-pipeline.config.github.json

      - name: Upload pipeline bundle
        uses: actions/upload-artifact@v4
        with:
          name: fire-monitor-cloud-pages
          path: fire_monitor/cloud-build/pages
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fire_monitor/cloud-build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  schedule-next:
    # GitHub 托管 cron 不保证准时触发；无论本轮成功或失败，都尝试续排下一轮。
    if: ${{ always() }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: write

    steps:
      - name: Wait until the next five-minute cycle
        env:
          CYCLE_STARTED_AT: ${{ needs.build.outputs.cycle-started-at }}
        run: |
          now=$(date +%s)
          started_at="${CYCLE_STARTED_AT:-$now}"
          next_cycle=$((started_at + 300))
          delay=$((next_cycle - now))
          if (( delay > 0 )); then
            echo "Waiting ${delay}s before scheduling the next cycle"
            sleep "$delay"
          fi

      - name: Dispatch the next cycle when none is queued
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: fire-monitor-cloud.yml
        run: |
          runs_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=20"
          other_active_runs=$(
            curl --fail-with-body --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$runs_url" |
              jq --argjson current "$GITHUB_RUN_ID" '
                [.workflow_runs[] |
                  select(
                    .id != $current and
                    (.status == "queued" or
                     .status == "in_progress" or
                     .status == "waiting" or
                     .status == "pending")
                  )
                ] | length
              '
          )

          if (( other_active_runs > 0 )); then
            echo "Another workflow run is already active; skipping self-dispatch"
            exit 0
          fi

          dispatch_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/dispatches"
          http_status=$(
            curl --silent --show-error --location \
              --output /tmp/workflow-dispatch-response.json \
              --write-out "%{http_code}" \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$dispatch_url" \
              --data "{\"ref\":\"${GITHUB_REF_NAME}\"}"
          )

          if [[ "$http_status" != "204" ]]; then
            echo "Failed to dispatch the next cycle (HTTP ${http_status})"
            cat /tmp/workflow-dispatch-response.json
            exit 1
          fi

          echo "Next five-minute cycle dispatched successfully"
