name: Fire Monitor Cloud Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fire-monitor-cloud
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash
        working-directory: fire_monitor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fire_monitor/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip numpy

      - name: Create runtime configs for GitHub Actions
        run: npm run config:github-actions
        env:
          JAXA_FTP_USER: ${{ secrets.JAXA_FTP_USER }}
          JAXA_FTP_PASSWORD: ${{ secrets.JAXA_FTP_PASSWORD }}

      - name: Initialize geodatabase
        run: node ./scripts/init-mobile-geodatabase.mjs --out ./fire_monitor.geodatabase

      - name: Run cloud pipeline once
        run: node ./scripts/cloud-pipeline.mjs --once --config ./.cloud-pipeline.config.github.json

      - name: Upload pipeline bundle
        uses: actions/upload-artifact@v4
        with:
          name: fire-monitor-cloud-pages
          path: fire_monitor/cloud-build/pages
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fire_monitor/cloud-build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
